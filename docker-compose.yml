services:
  db:
    image: mariadb:10.2
    restart: unless-stopped
    volumes:
      - mariadb:/var/lib/mysql
    env_file: '.env'

  rmt:
    build: .
    restart: unless-stopped
    env_file: '.env'
    volumes:
      - .:/srv/www/rmt
      - ./config/rmt.yml:/etc/rmt.conf
    depends_on:
      - db
    pre_stop:
      - command: rm -f /srv/www/rmt/tmp/pids/server.pid
    privileged: true
    command: bundle exec rails runner /srv/www/rmt/bin/compose-init.rb

  nginx:
    image: nginx:1.14
    volumes:
      - ./public:/var/www/
      - ./nginx/default.conf:/tmp/default.template
    environment:
      - EXTERNAL_PORT=${EXTERNAL_PORT:-8080}
    ports:
      - "${EXTERNAL_PORT:-8080}:80"
    depends_on:
      - rmt
    command:
      - bash
      - -ce
      - |
        envsubst '$$EXTERNAL_PORT' < /tmp/default.template > /etc/nginx/conf.d/default.conf
        nginx -g 'daemon off;'

volumes:
  mariadb:
  db_storage:
    driver: local
